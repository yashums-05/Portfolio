<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="700" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="500" y1="0" x2="500" y2="700" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="420" x2="600" y2="420" />
    <line x1="0" y1="560" x2="600" y2="560" />
  </g>

  <!-- Cybernetic Aura Circles -->
  <circle cx="300" cy="270" r="160" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="300" cy="270" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.4" />

  <!-- Abstract Head & Torso Silhouette -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 170 510 C 170 410, 220 370, 300 370 C 380 370, 430 410, 430 510 L 460 620 L 140 620 Z" fill="#1e293b" stroke="url(#accentGlow)" stroke-width="2" />
    <!-- Neck -->
    <rect x="270" y="310" width="60" height="80" rx="10" fill="#334155" />
    <!-- Head Oval -->
    <ellipse cx="300" cy="250" rx="90" ry="110" fill="#1e293b" stroke="url(#accentGlow)" stroke-width="3" />
    <!-- Stylized Modern Glasses / Visor -->
    <rect x="235" y="230" width="130" height="32" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="245" y1="246" x2="285" y2="246" stroke="#38bdf8" stroke-width="2" />
    <line x1="315" y1="246" x2="355" y2="246" stroke="#38bdf8" stroke-width="2" />
    <!-- Tech Accent on Chest -->
    <circle cx="300" cy="450" r="12" fill="#6366f1" filter="url(#neon)" />
    <text x="300" y="560" fill="#94a3b8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="3">YASHWANTH M S</text>
    <text x="300" y="585" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">CS ENGINEER &middot; JAVA &middot; AI/ML</text>
  </g>

  <!-- Photo Upload Cue Badge -->
  <g transform="translate(180, 630)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="120" y="22" fill="#c7d2fe" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📷 Click to Upload / Drop Photo</text>
  </g>
</svg>
