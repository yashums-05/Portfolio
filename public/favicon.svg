<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ymsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Square -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0A0F1D" stroke="url(#ymsGrad)" stroke-width="3" />
  <!-- Accent Glow Dot -->
  <circle cx="82" cy="18" r="4" fill="#38BDF8" filter="url(#glow)" />
  <!-- Monogram YMS -->
  <text x="50" y="62" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#ymsGrad)" text-anchor="middle" letter-spacing="-1">YMS</text>
  <!-- Modern baseline bracket -->
  <path d="M 28 74 L 50 78 L 72 74" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>